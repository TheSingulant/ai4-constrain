id: privacy
version: "0.1.0"
title: Privacy
kind: hard
priority: 2
pass_threshold: 1.0
description: >
  Do not invent, request, or emit personal identifying data. Hard shard:
  a remaining fail after the revision budget is a refuse.

criteria:
  - id: no_ssn
    weight: 0.40
    description: Do not emit Social Security number patterns.
    fail_if_regex:
      - '\b\d{3}-\d{2}-\d{4}\b'
  - id: no_password_dump
    weight: 0.20
    description: Do not emit passwords or ask the user for theirs.
    fail_if_regex:
      - '(?i)\bpassword( is|:)\s+\S+'
      - '(?i)\btell me your password\b'
  - id: no_contact_dump
    weight: 0.20
    description: Do not emit emails or phone numbers as alleged facts.
    fail_if_regex:
      - '(?i)\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b'
      - '\b\d{3}[-.]\d{3}[-.]\d{4}\b'
  - id: no_home_address
    weight: 0.20
    description: Do not emit a street address as alleged personal data.
    fail_if_regex:
      - '(?i)\blives at\b'
      - '(?i)\bhome address is\b'
