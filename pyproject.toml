[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4-constrain"
version = "0.7.0"
description = "AI4 constrained-authority runtime (v0.7): ai4.constrain DecisionReport path, optional GoverningIntegration hybrid semantic fuse, fail-closed controls, sibling ai4.identity provenance, offline .ai4 FileResolver."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "TheSingulant" }]
dependencies = [
  "PyYAML>=6.0",
  "cryptography>=41.0.0",
  "rfc8785==0.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ai4-experiment = "src.main:main"
ai4-constrain = "ai4.constrain.cli:main"
ai4-identity = "ai4.identity.resolve.cli:main"

[tool.setuptools.packages.find]
include = ["src*", "ai4*"]

[tool.setuptools.package-data]
"ai4" = ["py.typed"]
"ai4.identity" = ["py.typed"]
"ai4.data" = ["rubrics/v0.1/*.yaml", "semantic_v07/*.json", "semantic_v07/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
