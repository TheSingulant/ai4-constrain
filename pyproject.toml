[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4-constrain"
version = "0.5.0"
description = "Public ai4.constrain v0.5 runtime: frozen condition-D, ConstrainedSession persistence, proposal-provider policy wall, evaluator policy wall, and sibling ai4.identity provenance kernel."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "TheSingulant" }]
dependencies = [
  "PyYAML>=6.0",
  "cryptography>=41.0.0",
  "rfc8785==0.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ai4-experiment = "src.main:main"
ai4-constrain = "ai4.constrain.cli:main"

[tool.setuptools.packages.find]
include = ["src*", "ai4*"]

[tool.setuptools.package-data]
"ai4" = ["py.typed"]
"ai4.identity" = ["py.typed"]
"ai4.data" = ["rubrics/v0.1/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
